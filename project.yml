name: PersonalAgent
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  PersonalAgent:
    type: application
    platform: macOS
    sources:
      - path: MacApp
    info:
      path: MacApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Personal Agent
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Personal Agent listens to your voice when you invoke it. Audio is processed locally on this Mac and never stored.
        NSRemindersFullAccessUsageDescription: Personal Agent adds, lists and completes reminders when you ask it to.
        NSAppleEventsUsageDescription: Personal Agent uses Notes to keep its own notes, and reads yours only when you approve.
        NSLocationWhenInUseUsageDescription: Personal Agent uses your approximate location to find nearby events and places.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PARepoRoot: $(SRCROOT)
    entitlements:
      path: MacApp/Resources/PersonalAgent.entitlements
      properties:
        # Not sandboxed: the app launches and talks to its own local backend
        # and shares ~/Library/Application Support/PersonalAgent with it.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
