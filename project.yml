name: PersonalAgent
options:
  bundleIdPrefix: com.vishnupartha
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  PersonalAgent:
    type: application
    platform: macOS
    sources:
      - path: MacApp
    info:
      path: MacApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Personal Agent
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Personal Agent listens to your voice when you invoke it. Audio is processed locally on this Mac and never stored.
        NSLocationWhenInUseUsageDescription: Personal Agent uses your approximate location to find nearby events and places.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PARepoRoot: $(SRCROOT)
    entitlements:
      path: MacApp/Resources/PersonalAgent.entitlements
      properties:
        # Not sandboxed: the app launches and talks to its own local backend
        # and shares ~/Library/Application Support/PersonalAgent with it.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnupartha.PersonalAgent
        # A real (stable) signing identity, not ad-hoc: macOS ties the microphone
        # permission to the code signature, and an ad-hoc signature changes on
        # every build, after which TCC silently feeds the app zeros.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 52U8QDXBBG
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
